<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5CF8E"/>
      <stop offset="1" stop-color="#C79A4E"/>
    </linearGradient>
    <path id="p" d="M0,0 C-5,-4 -6,-12 0,-16 C6,-12 5,-4 0,0Z"/>
    <path id="l" d="M0,0 Q5,-8 0,-17 Q-5,-8 0,0Z"/>
  </defs>
  <g stroke="url(#g)" stroke-width="1.5">
    <circle cx="100" cy="100" r="84"/>
    <circle cx="100" cy="100" r="76" stroke-width=".8" stroke-dasharray="1.5 5"/>
    <!-- laurel along the lower arc -->
    <g transform="translate(100,100)">
      <use href="#l" transform="rotate(120) translate(0,-84) rotate(60)"/>
      <use href="#l" transform="rotate(138) translate(0,-84) rotate(60)"/>
      <use href="#l" transform="rotate(156) translate(0,-84) rotate(60)"/>
      <use href="#l" transform="rotate(174) translate(0,-84) rotate(60)"/>
      <use href="#l" transform="rotate(240) translate(0,-84) rotate(-60)"/>
      <use href="#l" transform="rotate(222) translate(0,-84) rotate(-60)"/>
      <use href="#l" transform="rotate(204) translate(0,-84) rotate(-60)"/>
      <use href="#l" transform="rotate(186) translate(0,-84) rotate(-60)"/>
    </g>
    <!-- frangipani crown -->
    <g transform="translate(100,16)" fill="#1c1418">
      <use href="#p"/>
      <use href="#p" transform="rotate(72)"/>
      <use href="#p" transform="rotate(144)"/>
      <use href="#p" transform="rotate(216)"/>
      <use href="#p" transform="rotate(288)"/>
      <circle r="2"/>
    </g>
  </g>
  <text x="100" y="121" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="60" fill="#ffffff">E<tspan font-size="34" fill="#EFBC72" dx="4" dy="-6">&amp;</tspan><tspan dx="4" dy="6">T</tspan></text>
</svg>
