    <use href="#l" transform="translate(48,150) rotate(-62) scale(.7)"/>
    <use href="#l" transform="translate(74,138) rotate(70) scale(.7)"/>
    <!-- dots -->
    <circle cx="16" cy="60" r="1.6" fill="url(#g)"/>
    <circle cx="104" cy="66" r="1.6" fill="url(#g)"/>
    <circle cx="60" cy="10" r="1.6" fill="url(#g)"/>
