<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3CD8F"/>
      <stop offset="1" stop-color="#B8924A"/>
    </linearGradient>
    <path id="l" d="M0,0 Q6,-9 0,-20 Q-6,-9 0,0Z"/>
    <path id="p" d="M0,0 C-5,-4 -6,-11 0,-15 C6,-11 5,-4 0,0Z"/>
  </defs>
  <g stroke="url(#g)" stroke-width="1.4">
    <!-- frame lines running out of the corner -->
    <path d="M70,8 H134"/>
    <path d="M8,70 V134"/>
    <path d="M78,16 H120" stroke-width=".8" opacity=".7"/>
    <path d="M16,78 V120" stroke-width=".8" opacity=".7"/>
    <!-- main carved arc with volutes at both ends -->
    <path d="M8,70 C8,34 34,8 70,8"/>
    <path d="M70,8 c15,0 23,11 19,21 c-3,8 -14,8 -16,1 c-1,-5 4,-8 8,-6"/>
    <path d="M8,70 c0,15 11,23 21,19 c8,-3 8,-14 1,-16 c-5,-1 -8,4 -6,8"/>
    <!-- inner arc + small curls -->
    <path d="M22,62 C24,40 40,24 62,22"/>
    <path d="M62,22 c8,-1 12,5 9,10 c-2,3 -7,2 -7,-2"/>
    <path d="M22,62 c-1,8 5,12 10,9 c3,-2 2,-7 -2,-7"/>
    <!-- leaves fanning from the arc -->
    <use href="#l" transform="translate(21,35) rotate(-45) scale(1.1)"/>
    <use href="#l" transform="translate(35,21) rotate(-45) scale(1.1)" />
    <use href="#l" transform="translate(14,50) rotate(-70) scale(.8)"/>
    <use href="#l" transform="translate(50,14) rotate(-20) scale(.8)"/>
    <!-- frangipani in the corner -->
    <g transform="translate(40,40)">
      <use href="#p"/>
      <use href="#p" transform="rotate(72)"/>
      <use href="#p" transform="rotate(144)"/>
      <use href="#p" transform="rotate(216)"/>
      <use href="#p" transform="rotate(288)"/>
      <circle r="1.8"/>
    </g>
    <circle cx="134" cy="8" r="1.8" fill="url(#g)"/>
    <circle cx="8" cy="134" r="1.8" fill="url(#g)"/>
  </g>
</svg>
